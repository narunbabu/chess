name: Deploy to Production

on:
  push:
    branches: [ master ]
  workflow_dispatch:
    inputs:
      check_only:
        description: "Only verify SSH login, write access and sudo rights (no deploy)"
        type: boolean
        default: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}   # private key whose .pub is in narun's ~/.ssh/authorized_keys; no passphrase
          port: 22
          script_stop: false
          script: |
            # Optimized deployment script with conditional execution
            # Only runs backend/frontend deployments when files actually changed

            set -e  # Exit on error for critical steps

            # ==================== CHECK ONLY (workflow_dispatch) ====================
            # Proves SERVER_SSH_KEY / SERVER_USER work and that the user can do what
            # the deploy needs, without touching production. See scripts/deploy-notes.md.
            if [ "${{ inputs.check_only }}" = "true" ]; then
              echo "🔑 SSH check only - nothing will be deployed"
              echo "user=$(whoami) host=$(hostname)"
              FAILED=0
              for p in /opt/Chess-Web/.git /var/www/chess99.com; do
                if [ -w "$p" ]; then echo "✅ writable: $p"; else echo "❌ not writable: $p"; FAILED=1; fi
              done
              if [ "$(id -u)" != "0" ]; then
                for cmd in \
                  "chown -R www-data:www-data /opt/Chess-Web/chess-backend/storage" \
                  "crontab -u www-data -l" \
                  "nginx -t" \
                  "systemctl restart php8.3-fpm" \
                  "systemctl restart chess-reverb" \
                  "systemctl reload nginx"; do
                  if sudo -n -l $cmd >/dev/null 2>&1; then echo "✅ sudo -n: $cmd"; else echo "❌ sudo needs a password or is denied: $cmd"; FAILED=1; fi
                done
              fi
              exit $FAILED
            fi

            echo "🚀 Starting deployment..."

            # ==================== GIT SYNC ====================
            echo ""
            echo "📦 Syncing code from repository..."
            cd /opt/Chess-Web

            # Store the previous commit for comparison
            PREV_COMMIT=$(git rev-parse HEAD)

            git fetch origin
            git reset --hard origin/master

            # Detect what changed
            BACKEND_CHANGED=false
            FRONTEND_CHANGED=false

            if git diff --name-only $PREV_COMMIT HEAD | grep -q "^chess-backend/"; then
              BACKEND_CHANGED=true
              echo "📋 Backend files changed - will deploy backend"
            else
              echo "ℹ️  No backend changes detected - skipping backend deployment"
            fi

            if git diff --name-only $PREV_COMMIT HEAD | grep -q "^chess-frontend/"; then
              FRONTEND_CHANGED=true
              echo "📋 Frontend files changed - will deploy frontend"
            else
              echo "ℹ️  No frontend changes detected - skipping frontend deployment"
            fi

            echo "✅ Code synced successfully"

            # ==================== BACKEND (Laravel) ====================
            if [ "$BACKEND_CHANGED" = true ]; then
              echo ""
              echo "🔧 Deploying Laravel backend..."
              cd chess-backend

              # Allow composer to run as superuser (deployment context)
              export COMPOSER_ALLOW_SUPERUSER=1  # harmless as narun; kept for root

              # Install dependencies with optimizations
              echo "📦 Installing Composer dependencies..."
              composer install --no-dev --optimize-autoloader --classmap-authoritative || {
                echo "⚠️  Composer install failed, continuing..."
              }

              # Run migrations
              echo "🗄️  Running database migrations..."
              php artisan migrate --force || {
                echo "⚠️  Migration failed or no new migrations"
              }

              # Clear and rebuild Laravel caches
              echo "🧹 Clearing and rebuilding Laravel caches..."
              php artisan optimize:clear || true
              php artisan optimize || true

              # Restart queue workers
              php artisan queue:restart || {
                echo "ℹ️  No queue workers running"
              }

              echo "✅ Backend deployment complete"
              cd /opt/Chess-Web
            fi

            # ==================== FRONTEND (React) ====================
            if [ "$FRONTEND_CHANGED" = true ]; then
              echo ""
              echo "⚛️  Deploying React frontend..."
              cd chess-frontend

              # Load NVM and use Node 20
              export NVM_DIR="$HOME/.nvm"
              [ -s "$NVM_DIR/nvm.sh" ] && \. "$NVM_DIR/nvm.sh"
              nvm use 20 || nvm install 20

              # Enable pnpm if available (check after NVM is loaded)
              if command -v pnpm &> /dev/null; then
                echo "📦 Using pnpm for package management..."
                PKG_MANAGER="pnpm"
              elif command -v npm &> /dev/null; then
                # Try to enable pnpm via corepack (Node 16.10+)
                echo "🔍 Checking for pnpm via corepack..."
                if corepack enable 2>/dev/null && command -v pnpm &> /dev/null; then
                  echo "📦 pnpm enabled via corepack"
                  PKG_MANAGER="pnpm"
                else
                  # Check if pnpm exists in npm global directory
                  NPM_GLOBAL_BIN=$(npm config get prefix 2>/dev/null)/bin
                  if [ -f "$NPM_GLOBAL_BIN/pnpm" ]; then
                    export PATH="$NPM_GLOBAL_BIN:$PATH"
                    echo "📦 pnpm found in npm global directory"
                    PKG_MANAGER="pnpm"
                  else
                    echo "📦 Using npm for package management..."
                    PKG_MANAGER="npm"
                  fi
                fi
              else
                echo "❌ No package manager found!"
                exit 1
              fi

              # Verify package manager is working
              echo "ℹ️  Package manager: $PKG_MANAGER ($(which $PKG_MANAGER))"

              # Install dependencies
              echo "📦 Installing dependencies with $PKG_MANAGER..."
              if [ "$PKG_MANAGER" = "pnpm" ]; then
                pnpm install || {
                  echo "❌ pnpm install failed - this is critical!"
                  exit 1
                }
              else
                npm install || {
                  echo "❌ npm install failed - this is critical!"
                  exit 1
                }
              fi

              echo "✅ Dependencies installed successfully"

              # Build React application
              echo "🏗️  Building React application..."
              export DISABLE_ESLINT_PLUGIN=true
              export CI=false
              export GENERATE_SOURCEMAP=false

              if [ "$PKG_MANAGER" = "pnpm" ]; then
                pnpm run build || {
                  echo "❌ Build failed - this is critical!"
                  exit 1
                }
              else
                npm run build || {
                  echo "❌ Build failed - this is critical!"
                  exit 1
                }
              fi

              # Deploy frontend build to web server
              echo "📤 Deploying build to web server..."
              rsync -av --delete build/ /var/www/chess99.com/ || {
                echo "❌ Rsync failed - this is critical!"
                exit 1
              }

              echo "✅ Frontend deployment complete"
              cd /opt/Chess-Web
            fi

            # ==================== PERMISSIONS ====================
            if [ "$BACKEND_CHANGED" = true ]; then
              echo ""
              echo "🔐 Setting file permissions..."
              sudo chown -R www-data:www-data /opt/Chess-Web/chess-backend/storage || true
              sudo chown -R www-data:www-data /opt/Chess-Web/chess-backend/bootstrap/cache || true
              echo "✅ Permissions updated"

              # ==================== LOG ROTATION SETUP ====================
              echo ""
              echo "🔄 Configuring log rotation..."
              cd /opt/Chess-Web/chess-backend

              # Check if log rotation command exists
              if php artisan list | grep -q "logs:rotate"; then
                echo "✅ Log rotation command available"

                # Set up Laravel scheduler cron job for www-data user
                CRON_CMD="* * * * * cd /opt/Chess-Web/chess-backend && php artisan schedule:run >> /dev/null 2>&1"

                # Check if cron job already exists
                if sudo crontab -u www-data -l 2>/dev/null | grep -q "artisan schedule:run"; then
                  echo "ℹ️  Laravel scheduler cron already configured"
                else
                  echo "📋 Installing Laravel scheduler cron job..."
                  # Add cron job for www-data user
                  (sudo crontab -u www-data -l 2>/dev/null; echo "$CRON_CMD") | sudo crontab -u www-data - && {
                    echo "✅ Laravel scheduler cron job installed"
                  } || {
                    echo "⚠️  Failed to install cron job - may need manual setup"
                  }
                fi

                # Verify the setup
                if sudo crontab -u www-data -l 2>/dev/null | grep -q "artisan schedule:run"; then
                  echo "✅ Log rotation automated via Laravel scheduler"

                  # Optional: Run rotation now if logs are large
                  LOG_SIZE=$(du -sm /opt/Chess-Web/chess-backend/storage/logs/laravel.log 2>/dev/null | cut -f1)
                  if [ ! -z "$LOG_SIZE" ] && [ "$LOG_SIZE" -gt 10 ]; then
                    echo "ℹ️  Current log size: ${LOG_SIZE}MB - running rotation..."
                    php artisan logs:rotate --force || echo "⚠️  Log rotation encountered issues"
                  fi
                else
                  echo "⚠️  Scheduler setup incomplete - log rotation may not work automatically"
                  echo "💡 Manual setup: Run 'sudo crontab -u www-data -e' and add:"
                  echo "    $CRON_CMD"
                fi
              else
                echo "⚠️  Log rotation command not found"
                echo "💡 Ensure app/Console/Commands/LogRotation.php is committed to repository"
              fi
            fi

            # ==================== NGINX CONFIGURATION ====================
            echo ""
            echo "📝 Updating nginx configuration..."
            cd /opt/Chess-Web

            # Disable exit-on-error for nginx config update (non-critical)
            set +e

            if [ -f nginx-api-fix.conf ]; then
              # Backup current config
              sudo cp /etc/nginx/sites-available/api.chess99.com /etc/nginx/sites-available/api.chess99.com.backup-$(date +%Y%m%d-%H%M%S)

              # Copy new config
              sudo cp nginx-api-fix.conf /etc/nginx/sites-available/api.chess99.com

              # Test nginx config
              if sudo nginx -t 2>&1 | grep -q "successful"; then
                echo "✅ Nginx configuration updated successfully"
              else
                echo "⚠️  Nginx configuration test failed, reverting..."
                LATEST_BACKUP=$(ls -t /etc/nginx/sites-available/api.chess99.com.backup-* 2>/dev/null | head -1)
                if [ -n "$LATEST_BACKUP" ]; then
                  sudo cp "$LATEST_BACKUP" /etc/nginx/sites-available/api.chess99.com
                  echo "↩️  Reverted to previous configuration"
                fi
              fi
            else
              echo "⚠️  nginx-api-fix.conf not found, skipping nginx config update"
            fi

            # Re-enable exit-on-error
            set -e

            # ==================== SERVICE RESTART ====================
            if [ "$BACKEND_CHANGED" = true ] || [ "$FRONTEND_CHANGED" = true ]; then
              echo ""
              echo "♻️  Restarting services..."

              # Disable exit-on-error for service restarts (may not all exist)
              set +e

              # Restart PHP-FPM only if backend changed
              if [ "$BACKEND_CHANGED" = true ]; then
                sudo systemctl restart php8.3-fpm && echo "✅ PHP-FPM restarted" || echo "⚠️  PHP-FPM restart failed"
                sudo systemctl restart chess-reverb && echo "✅ Reverb restarted" || echo "⚠️  chess-reverb restart failed"
              fi

              # Reload nginx if anything changed
              sudo systemctl reload nginx && echo "✅ Nginx reloaded" || echo "⚠️  Nginx reload failed"

              # Re-enable exit-on-error
              set -e

              echo "✅ Services restarted successfully"
            fi

            # ==================== DEPLOYMENT COMPLETE ====================
            echo ""
            echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
            if [ "$BACKEND_CHANGED" = true ] && [ "$FRONTEND_CHANGED" = true ]; then
              echo "✅ Deployment completed successfully! (Backend + Frontend)"
            elif [ "$BACKEND_CHANGED" = true ]; then
              echo "✅ Deployment completed successfully! (Backend only)"
            elif [ "$FRONTEND_CHANGED" = true ]; then
              echo "✅ Deployment completed successfully! (Frontend only)"
            else
              echo "✅ Deployment completed! (No code changes - config/infra only)"
            fi
            echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
            echo ""

            # Ensure script always exits with success (unless critical failure occurred)
            exit 0
